<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #171320; color: #E8E4F0; font-family: system-ui, sans-serif; }
  body { padding: 18px; line-height: 1.55; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  p { font-size: 13px; margin: 0 0 10px; color: #9282B5; }
  code { font-family: ui-monospace, Consolas, monospace; background: rgba(167, 139, 250, .14); padding: 1px 5px; border-radius: 4px; font-size: 12px; color: #E8E4F0; }
  ul { margin: 0; padding-left: 18px; font-size: 13px; color: #9282B5; }
  li { margin: 4px 0; }
</style>
</head>
<body>
  <h1>Nebula Aura Theme</h1>
  <p>This plugin contributes four global themes and nothing else.</p>
  <ul>
    <li>Apply: Settings -&gt; Theme -&gt; search <code>Nebula</code></li>
    <li>Revert: pick Light / Dark / System in the theme picker</li>
  </ul>
  <p>Dev-only page. Theme files: <code>themes/nebula-aura-*.css</code> (edit, then restart the app).</p>
</body>
</html>
